<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | LAXMAN TELECOM</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth-style.css">
</head>
<body>

<header class="header">
  <div class="logo">
    <h1>LAXMAN TELECOM</h1>
    <p>Your Trusted Digital Service Center</p>
  </div>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<div class="dash-wrapper">

  <div class="dash-card">
    <div class="dash-top">
      <h2>My Profile</h2>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
    <p><strong>Name:</strong> <span id="pName">-</span></p>
    <p><strong>Email:</strong> <span id="pEmail">-</span></p>
    <p><strong>Phone:</strong> <span id="pPhone">-</span></p>
  </div>

  <div class="dash-card">
    <h2>New Service Request</h2>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <form id="requestForm">
      <div class="form-group">
        <label>Service Needed</label>
        <select id="reqService" required>
          <option value="">-- Select a service --</option>
          <option>Mobile Repair</option>
          <option>Aadhaar & PAN Services</option>
          <option>Punjab Smart Ration Card</option>
          <option>Voter ID Services</option>
          <option>Ayushman Bharat</option>
          <option>PM-KISAN</option>
          <option>e-Shram & Labour</option>
          <option>MSME (Udyam)</option>
          <option>Banking Services</option>
          <option>Travel Booking</option>
          <option>Printing Services</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Details</label>
        <textarea id="reqMessage" rows="3" placeholder="Describe what you need..."></textarea>
      </div>
      <button type="submit" class="auth-btn">Submit Request</button>
    </form>
  </div>

  <div class="dash-card">
    <h2>My Requests</h2>
    <div id="requestsList">
      <p>Loading...</p>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function doLogout() {
  auth.signOut().then(() => { window.location.href = 'login.html'; });
}

let currentUser = null;

auth.onAuthStateChanged((user) => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  if (user.email === ADMIN_EMAIL) {
    window.location.href = 'admin.html';
    return;
  }
  currentUser = user;
  loadProfile(user.uid);
  loadRequests(user.uid);
});

function loadProfile(uid) {
  db.ref('users/' + uid).once('value').then((snap) => {
    const data = snap.val() || {};
    document.getElementById('pName').textContent = data.name || '-';
    document.getElementById('pEmail').textContent = data.email || '-';
    document.getElementById('pPhone').textContent = data.phone || '-';
  });
}

document.getElementById('requestForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const service = document.getElementById('reqService').value;
  const message = document.getElementById('reqMessage').value.trim();
  if (!service) { showError('Please select a service.'); return; }

  db.ref('requests/' + currentUser.uid).push({
    service,
    message,
    status: 'Pending',
    createdAt: firebase.database.ServerValue.TIMESTAMP
  }).then(() => {
    showSuccess('Request submitted!');
    document.getElementById('requestForm').reset();
  }).catch((err) => showError(err.message));
});

function loadRequests(uid) {
  db.ref('requests/' + uid).on('value', (snap) => {
    const data = snap.val();
    const container = document.getElementById('requestsList');
    if (!data) {
      container.innerHTML = '<p>No requests yet.</p>';
      return;
    }
    const entries = Object.entries(data).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    container.innerHTML = entries.map(([id, r]) => {
      const statusClass = 'status-' + (r.status || 'Pending').replace(/\s/g, '');
      const date = r.createdAt ? new Date(r.createdAt).toLocaleDateString() : '';
      return `<div class="request-item">
        <strong>${r.service}</strong>
        <span class="status-pill ${statusClass}">${r.status || 'Pending'}</span>
        <p style="margin:6px 0 0;color:#555;font-size:14px;">${r.message || ''}</p>
        <p style="margin:4px 0 0;color:#999;font-size:12px;">${date}</p>
      </div>`;
    }).join('');
  });
}
</script>

</body>
</html>
